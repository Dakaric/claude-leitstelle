          /* Zeiten sind Sekunden im Gesamtvideo; diese Komposition beginnt bei Sekunde 5. */
          const OFFSET = 5;
          const tl = gsap.timeline({ paused: true });
          const at = (t) => t - OFFSET;
          const SCENES = [
            { id: "#cap1", step: 0, start: 5.2, end: 14 },
            { id: "#cap2", step: 1, start: 14, end: 24 },
            { id: "#cap3", step: 2, start: 24, end: 33 },

            { id: "#cap5", step: 4, start: 43, end: 50 },
            { id: "#cap6", step: 5, start: 50, end: 60 },
            { id: "#cap7", step: null, start: 60, end: 67 },
          ];
          const segs = document.querySelectorAll("#rail .seg");

          tl.fromTo("#rail", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, at(5.4));
          SCENES.forEach(({ id, step, start, end }) => {
            const parts = [id + " .kicker", id + " h2", id + " p"];
            tl.fromTo(parts[0], { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at(start + 0.1));
            tl.fromTo(parts[1], { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, ease: "power4.out" }, at(start + 0.18));
            tl.fromTo(parts[2], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, at(start + 0.4));
            tl.fromTo(parts, { opacity: 1, y: 0 }, { opacity: 0, y: -16, duration: 0.3, ease: "power2.in", immediateRender: false }, at(end - 0.38));
            if (step === null) return;
            const seg = segs[step];
            tl.fromTo(seg.querySelector("b"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, at(start + 0.1));
            tl.fromTo(seg.querySelector("span"), { color: "#a39a87" }, { color: "#f2a93b", duration: 0.3 }, at(start + 0.1));
          });
          tl.fromTo("#rail", { opacity: 1 }, { opacity: 0, duration: 0.4, immediateRender: false }, at(66.9));
          window.__timelines["headlines"] = tl;

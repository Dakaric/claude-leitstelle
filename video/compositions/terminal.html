      <script>
        (function () {
          /* Alle Zeiten sind Sekunden im Gesamtvideo; diese Komposition beginnt bei Sekunde 5. */
          const OFFSET = 5;
          const TL = gsap.timeline({ paused: true });
          const first = (target, from, to, t) => TL.fromTo(target, from, to, t - OFFSET);
          const tween = (target, from, to, t) => TL.fromTo(target, from, Object.assign({ immediateRender: false }, to), t - OFFSET);
          /* ---------- Raster der Terminal-Oberfläche ---------- */
          const LH = 19, CW = 7.8, PADX = 14, PADY = 8, TITLE_H = 26, STATUS_H = 22, AREA = { x: 200, y: 36 };
          const PROMPT = "~/code/kompass ❯ ";
          const PROMPT_HTML = '<span class="cwd">~/code/kompass</span> <span class="car">❯</span> ';
          const CARET = '<span class="car">❯</span> ';
          const status = (name, extra) => "<b>▸▸ auto</b> · " + name + " · " + extra;
          const PANES = {
            L: { x: 0, y: 0, w: 716, h: 500, mw: 1560, mh: 816, clip0: "inset(0px 0px 0px 0px)", title: "Leitstelle", sub: "kompass-leitstelle", status: status("kompass-leitstelle", "main") },
            A: { x: 0, y: 500, w: 716, h: 316, mw: 716, mh: 316, clip0: "inset(316px 0px 0px 0px)", title: "Advisor", sub: "kompass-advisor · nur lesen", status: status("kompass-advisor", "ohne Bash, Edit, Write") },
            S1: { x: 716, y: 0, w: 422, h: 408, mw: 844, mh: 816, clip0: "inset(0px 0px 0px 844px)", title: "Session 1", sub: "Suche: Filter nach Region", status: status("kompass-session1", "main") },
            S2: { x: 1138, y: 0, w: 422, h: 408, mw: 422, mh: 816, clip0: "inset(0px 0px 0px 422px)", title: "Session 2", sub: "Gutscheincodes im Checkout", status: status("kompass-session2", "main") },
            S3: { x: 716, y: 408, w: 422, h: 408, mw: 422, mh: 408, clip0: "inset(408px 0px 0px 0px)", title: "Session 3", sub: "Abmeldelink im Newsletter", status: status("kompass-session3", "main") },
            S4: { x: 1138, y: 408, w: 422, h: 408, mw: 422, mh: 408, clip0: "inset(408px 0px 0px 0px)", title: "Session 4", sub: "Ladezeit der Kartenansicht", status: status("kompass-session4", "main") },
          };
          const SES = ["S1", "S2", "S3", "S4"];
          const flowSvg = document.querySelector("#flow svg");
          const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          const make = (cls, html, parent, style) => {
            const n = Object.assign(document.createElement("div"), { className: cls, innerHTML: html || "" });
            Object.assign(n.style, style || {});
            return parent.appendChild(n);
          };

          function wrap(str, width, indent) {
            const out = [];
            let rest = str;
            while (rest.length) {
              const pre = out.length ? " ".repeat(indent) : "";
              const avail = width - pre.length;
              if (rest.length <= avail) return out.concat(pre + rest);
              let cut = rest.lastIndexOf(" ", avail);
              if (cut <= 0) cut = avail;
              out.push(pre + rest.slice(0, cut));
              rest = rest.slice(cut).replace(/^ /, "");
            }
            return out;
          }

          Object.entries(PANES).forEach(([id, p]) => {
            p.cap = Math.floor((p.h - TITLE_H - STATUS_H - 2 * PADY) / LH);
            p.cols = Math.floor((p.w - 2 * PADX) / CW) - 1;
            p.rows = [];
            p.el = make("pane", "", document.getElementById("panes"), { left: p.x + "px", top: p.y + "px", width: p.mw + "px", height: p.mh + "px", clipPath: p.clip0 });
            make("ptitle", "<b>" + p.title + "</b><span>" + p.sub + "</span>", p.el, { width: p.mw + "px" });
            const body = make("pbody", "", p.el, { left: PADX + "px", top: TITLE_H + PADY + "px", width: p.w - 2 * PADX + "px", height: p.cap * LH + "px" });
            body.setAttribute("data-layout-allow-overflow", "");
            p.content = make("pcontent", "", body);
            p.statusEl = make("pstatus", p.status, p.el, { top: p.h - STATUS_H + "px", width: p.w + "px" });
          });
          /* ---------- Zeilen: jede sichtbare Terminalzeile ist ein eigenes Element mit fester Höhe ---------- */
          function addRow(id, html, cls, at, span) {
            const row = make("row" + (cls ? " " + cls : ""), html, PANES[id].content, at <= 0 ? { opacity: 1 } : {});
            PANES[id].rows.push({ el: row, at: at, span: span || 1 });
            return row;
          }
          function say(id, at, head, text, cls, stagger) {
            const st = stagger === undefined ? 0.045 : stagger;
            return wrap(head + text, PANES[id].cols, 2).map((ln, i) => {
              const html = i === 0 && head ? '<span class="h">' + esc(head) + "</span>" + esc(ln.slice(head.length)) : esc(ln);
              return addRow(id, html, cls, at + i * st);
            });
          }
          function typeInto(id, at, prefix, prefixHtml, text, dur, firstRowAt, hang) {
            let t = at;
            wrap(prefix + text, PANES[id].cols, hang).forEach((ln, i) => {
              const chunk = ln.slice(i === 0 ? prefix.length : hang);
              const lead = i === 0 ? prefixHtml : " ".repeat(hang);
              const row = addRow(id, lead + '<span class="tp">' + esc(chunk) + "</span>", "", i === 0 ? firstRowAt : t);
              const d = dur > 0 ? (dur * chunk.length) / text.length : 0.03;
              const ease = dur > 0 ? "steps(" + Math.max(1, chunk.length) + ")" : "none";
              first(row.querySelector(".tp"), { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: d, ease: ease, immediateRender: true }, t);
              t += d;
            });
          }
          const shell = (id, at, text, dur) => typeInto(id, at, PROMPT, PROMPT_HTML, text, dur, 0, 0);
          const prompt = (id, at, text, dur) => typeInto(id, at, "❯ ", CARET, text, dur, at, 2);
          function welcome(id, at, name) {
            addRow(id, '<div class="cbox"><div><span class="star">✻</span> Claude Code</div><div class="d">' + name + " · " + (id === "A" ? "~/.claude/leitstelle/kompass" : "~/code/kompass") + "</div></div>", "boxrow", at, 3);
            first(PANES[id].statusEl, { opacity: 0 }, { opacity: 1, duration: 0.2 }, at + 0.05);
          }
          function finalize(id) {
            const p = PANES[id];
            let units = 0, shown = 0;
            p.rows.forEach((r) => {
              units += r.span;
              if (r.at > 0) first(r.el, { opacity: 0 }, { opacity: 1, duration: 0.05 }, r.at);
              const need = Math.max(0, units - p.cap);
              if (need > shown) tween(p.content, { y: -shown * LH }, { y: -need * LH, duration: 0.04, ease: "none" }, r.at);
              shown = Math.max(shown, need);
            });
          }
          /* ---------- Nachrichtenfluss: Linie, Paket, Aufleuchten ---------- */
          const rect = (id) => ({ x: AREA.x + PANES[id].x, y: AREA.y + PANES[id].y, w: PANES[id].w, h: PANES[id].h });
          const center = (id) => ({ x: rect(id).x + rect(id).w / 2, y: rect(id).y + rect(id).h / 2 });
          function glow(id, t, strength) {
            const r = rect(id);
            const g = make("glow", "", document.getElementById("glows"), { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
            first(g, { opacity: 0 }, { opacity: strength, duration: 0.12, immediateRender: false }, t);
            tween(g, { opacity: strength }, { opacity: 0, duration: 0.9, ease: "power2.out" }, t + 0.12);
          }
          function packet(from, to, label, t, d) {
            const a = center(from), b = center(to);
            const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
            [["x1", a.x], ["y1", a.y], ["x2", b.x], ["y2", b.y], ["pathLength", 1]].forEach(([k, v]) => ln.setAttribute(k, v));
            flowSvg.appendChild(ln);
            first(ln, { strokeDashoffset: 1, opacity: 0.75 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut", immediateRender: false }, t);
            tween(ln, { opacity: 0.75 }, { opacity: 0, duration: 0.4 }, t + d + 0.1);
            const pill = make("pkt", esc(label), document.getElementById("flow"));
            pill.setAttribute("data-layout-allow-occlusion", "");
            first(pill, { x: a.x, y: a.y, xPercent: -50, yPercent: -50, scale: 0.6 }, { x: b.x, y: b.y, scale: 1, duration: d, ease: "power2.inOut", immediateRender: false }, t);
            first(pill, { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, t);
            tween(pill, { opacity: 1 }, { opacity: 0, duration: 0.2 }, t + d);
            glow(from, t, 0.5);
            glow(to, t + d, 1);
            return t + d;
          }
          function flash(rows, t) {
            first(rows, { backgroundColor: "#201c15" }, { backgroundColor: "#6b4c1c", duration: 0.18, immediateRender: false }, t);
            tween(rows, { backgroundColor: "#6b4c1c" }, { backgroundColor: "#201c15", duration: 0.5 }, t + 0.7);
          }
          const RIGHT = { keys: ["⌘", "D"], label: "nach rechts teilen" };
          const DOWN = { keys: ["⌘", "⇧", "D"], label: "nach unten teilen" };
          /* Eine Advisor-Runde: Session 2 fragt, die Leitstelle legt die Akte bei, der Advisor antwortet direkt mit Kopie. */
          function advisorRound(t, pace, n, copyNote, question, answer) {
            const id = "F-S2-0" + n, at = (dt) => t + dt * pace;
            const frage = "ADVISOR-FRAGE " + id + " (Session 2, kompass-session2): " + question;
            say("S2", t, "● SendMessage → kompass-leitstelle: ", frage, "hl");
            const asked = packet("S2", "L", "ADVISOR-FRAGE", at(0.4), 1.0 * pace);
            say("L", asked + 0.05, "← kompass-session2: ", frage, "in hl", 0.03);
            say("L", at(2.0), "● ", "Akte beigelegt: advisor/kontext-s2.md (Ziel, Plan, Entscheidungen)", "");
            say("L", at(2.3), "● ", "SendMessage an kompass-advisor: ADVISOR-FRAGE " + id + " mit Akte", "");
            const forwarded = packet("L", "A", "FRAGE + AKTE", at(2.5), 0.75 * pace);
            say("A", forwarded + 0.05, "← kompass-leitstelle: ", "ADVISOR-FRAGE " + id + " von Session 2 (kompass-session2), weitergeleitet von Leitstelle kompass-leitstelle. Kontext: advisor/kontext-s2.md", "in");
            say("A", at(3.95), "● ", "Read advisor/kontext-s2.md, src/checkout/gutschein.ts", "");
            say("A", at(4.4), "● SendMessage → kompass-session2, Kopie an kompass-leitstelle: ", "ADVISOR-ANTWORT " + id, "");
            const answered = packet("A", "S2", "ADVISOR-ANTWORT", at(4.7), 1.05 * pace);
            const copied = packet("A", "L", "KOPIE", at(4.8), 0.6 * pace);
            say("L", copied + 0.05, "← Kopie von kompass-advisor: ", "ADVISOR-ANTWORT " + id + ", " + copyNote, "in");
            say("S2", answered + 0.05, "← kompass-advisor: ", "ADVISOR-ANTWORT " + id + ": " + answer, "in hl2");
          }
          function keycap(combo, t, out) {
            const keys = combo.keys.map((k) => '<div class="key">' + k + "</div>").join("");
            const card = make("kcard", keys + '<div class="klabel">' + combo.label + "</div>", document.getElementById("keys-stage"));
            first(card, { opacity: 0, y: 26, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, t - 0.45);
            first(card.querySelectorAll(".key"), { y: 0 }, { y: 4, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, t - 0.1);
            tween(card, { opacity: 1, y: 0 }, { opacity: 0, y: -12, duration: 0.22, ease: "power2.in" }, out);
          }
          /* ---------- Szene 2: Fenster erscheint, fünf Teilungen ---------- */
          first("#viewport", { y: 90, opacity: 0, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 5.1);
          const SPLITS = [

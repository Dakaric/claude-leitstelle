<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Leitstelle für Claude Code</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0f0d0a;
        --win: #14120e;
        --pane: #17140f;
        --side: #110f0b;
        --bar: #1b1812;
        --fg: #ece4d3;
        --dim: #a39a87;
        --amber: #f2a93b;
        --ink: #1a1408;
        --line: #2e2920;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: Montserrat, sans-serif;
      }
      #bg-grid {
        position: absolute;
        inset: -96px 0 0 0;
        background-image:
          linear-gradient(rgba(242, 169, 59, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(242, 169, 59, 0.07) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      #bg-glow {
        position: absolute;
        left: 260px;
        top: 160px;
        width: 1400px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          rgba(242, 169, 59, 0.22),
          rgba(242, 169, 59, 0.06) 60%,
          rgba(242, 169, 59, 0) 100%
        );
      }
      .host {
        position: absolute;
        inset: 0;
      }
      .kicker {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--amber);
      }
      .ghost::before {
        content: attr(data-ghost);
        font-family: Montserrat, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: rgba(242, 169, 59, 0.12);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-rrpb" id="root" data-composition-id="main" data-start="0" data-duration="74" data-width="1920" data-height="1080">
      <div data-hf-id="hf-r3kh" id="bg-grid"></div>
      <div data-hf-id="hf-isbq" id="bg-glow"></div>
      <div data-hf-id="hf-cd5m" id="hook" class="host" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-353m" id="terminal" class="host" data-composition-id="terminal" data-composition-src="compositions/terminal.html" data-start="5" data-duration="63" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-n9nv" id="headlines" class="host" data-composition-id="headlines" data-composition-src="compositions/headlines.html" data-start="5" data-duration="62.4" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-ymre" id="close" class="host" data-composition-id="close" data-composition-src="compositions/close.html" data-start="67" data-duration="7" data-track-index="4" data-width="1920" data-height="1080"></div>
      <audio id="vo-01-hook" src="assets/vo/01-hook.mp3" data-start="0.15" data-duration="4.21" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-02-teilen" src="assets/vo/02-teilen.mp3" data-start="5.55" data-duration="6.87" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-03-starten" src="assets/vo/03-starten.mp3" data-start="14.15" data-duration="8.91" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-04-einfuegen" src="assets/vo/04-einfuegen.mp3" data-start="24.15" data-duration="5.59" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-05-anmelden" src="assets/vo/05-anmelden.mp3" data-start="33.15" data-duration="9.27" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-06-advisor" src="assets/vo/06-advisor.mp3" data-start="43.15" data-duration="5.43" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-07-arbeiten" src="assets/vo/07-arbeiten.mp3" data-start="50.15" data-duration="9.22" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-08-buendeln" src="assets/vo/08-buendeln.mp3" data-start="60.15" data-duration="4.31" data-track-index="5" data-volume="1"></audio>
      <audio id="vo-09-abschluss" src="assets/vo/09-abschluss.mp3" data-start="67.35" data-duration="5.33" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-glow", { scale: 1, opacity: 0.7 }, { scale: 1.12, opacity: 1, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 17 }, 0);
      tl.fromTo("#bg-grid", { y: 0 }, { y: 48, duration: 74, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
